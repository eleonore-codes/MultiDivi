<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lokale Browserprüfung</title><link rel="stylesheet" href="../styles.css"><main><h1>Lokale Browserprüfung</h1><p>Nur Testdaten auf localhost. Der normale Lernstand bleibt unverändert.</p><button id="rest">Restaufgabe im Testmodus vorbereiten</button><a class="button" href="../?dev=1">Test-App öffnen</a><button id="cards">Alle drei Karten prüfen</button><p id="result" role="status"></p><div id="cards-output"></div></main><script type="module">
import {freshState,ensureDay,saveState,STORAGE_KEY} from '../storage.js';
import {createCard} from '../share-card.js';
if(!['localhost','127.0.0.1'].includes(location.hostname)){document.querySelector('main').textContent='Nur lokal verfügbar.';}else{
document.querySelector('#rest').onclick=()=>{const s=freshState();ensureDay(s);s.level2=true;s.day.stage='rest';s.day.returnStage='ready';s.day.active={id:'r-7-8-2',interrupted:true};saveState(s,localStorage,STORAGE_KEY+'-dev');document.querySelector('#result').textContent='Testaufgabe 58 : 7 vorbereitet.';};
document.querySelector('#cards').onclick=async()=>{const host=document.querySelector('#cards-output');host.replaceChildren();for(const date of ['2026-09-18','2026-09-19','2026-09-20']){const blob=await createCard({date,results:{a:{correct:72,wrong:8},b:{correct:38,wrong:2},comparison:{adequate:true,before:{accuracy:80},after:{accuracy:90},message:'Bei gleichen Aufgaben warst du im zweiten Teil sicherer.'}}});const img=new Image();img.className='card-image';img.alt='Karte '+date;img.src=URL.createObjectURL(blob);host.append(img);}document.querySelector('#result').textContent='Drei PNG-Karten erstellt.';};}
</script></html>
